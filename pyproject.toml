[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hx-bib"
version = "0.1.0"
description = "A tidy toolbox for BibTeX: format, clean, normalize venues, validate and verify citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "qysys" }]
keywords = ["bibtex", "citation", "latex", "reference", "hallucination"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "nicegui>=4.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hx-bib = "hx_bib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hx_bib.gui" = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
